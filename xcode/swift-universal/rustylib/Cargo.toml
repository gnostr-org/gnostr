[package]
name = "rustylib"
version = "973442.1842.47042"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]
name = "rustylib"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
gnostr-p2p = { package = "gnostr-p2p", path = "../../../p2p", version = ">=973442.1842.47042" }
gnostr-relay = { version = ">=973442.1842.47042", path = "../../../relay" }
uniffi = { version = "0.28.0", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.28.0", features = ["build"] }

[package]
name = "asyncgit_ffi"
version = "953258.1868.506994"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
gnostr-asyncgit = { path = "../../../../asyncgit", package = "gnostr-asyncgit" }
gnostr-types = { path = "../../../../types", package = "gnostr-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

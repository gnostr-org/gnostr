# Relay config template
#
# This file starts with commented examples so you can uncomment only the
# settings you want to override.

# [information]
# name = "gnostr-relay"
# description = "GnostrApp:a git+nostr workflow utility"
# software = "https://github.com/gnostr-org/gnostr"

# [data]
# path = "./data"
# db_query_timeout = "100ms"

# [network]
# host = "127.0.0.1"
# port = 0
# index_redirect_to = "https://gnostr.org"

# [limitation]
# max_message_length = 524288
# max_subscriptions = 20
# max_filters = 10
# max_limit = 300
# max_subid_length = 100
# min_prefix = 10
# max_event_tags = 5000
# max_event_time_older_than_now = 94608000
# max_event_time_newer_than_now = 900

# [auth]
# enabled = false

# [rate_limiter]
# enabled = false

# [count]
# enabled = false

# [search]
# enabled = false

name: FFI

on:
  push:
    branches:
      - "master"
      - "1843/**"
  pull_request:
  workflow_dispatch:

jobs:
  rust-ffi:
    name: Rust FFI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
          cache-dependency-path: go.sum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ffi/rust
            test/rust-ffi-test

      - name: Build Go FFI
        run: cd ffi && go build ./...

      - name: Go vet
        run: cd ffi && go vet ./...

      - name: Build Rust binding
        run: cd ffi/rust && cargo build

      - name: Run Rust FFI tests
        run: cd test/rust-ffi-test && cargo run

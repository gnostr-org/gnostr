[package]
name = "gnostr-scopetime"
version.workspace = true
authors = ["extrawurst <mail@rusticorn.com>"]
edition = "2021"
description = "log runtime of arbitrary scope"
repository = "https://github.com/gnostr-org/gnostr"
license = "MIT"
readme = "README.md"
categories = ["development-tools::profiling"]
keywords = ["profiling", "logging"]

[lib]
name = "gnostr_scopetime"
path = "src/lib.rs"

[features]
default = []
enabled = ["gitui_scopetime/enabled"]

[dependencies]
gitui_scopetime = { package = "scopetime", version = ">=0.1.0" }
log = "0.4"
